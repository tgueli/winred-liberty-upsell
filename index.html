/* ---------- Top bar ---------- */
.topbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .55rem var(--gutter); background: linear-gradient(var(--navy-2), var(--navy)); border-bottom: 3px solid var(--gilt); color: var(--white); }
.pill { display: inline-flex; align-items: center; gap: .4rem; min-height: 2.6rem; padding: .2rem .8rem .2rem .3rem; border: 2px solid var(--gilt); border-radius: 999px; background: var(--navy-deep); color: var(--white); font-weight: 700; font-size: 1.05rem; cursor: pointer; touch-action: manipulation; font-variant-numeric: tabular-nums; }
.pill > svg { width: 2rem; height: 2rem; }
.pill .sub { font-size: .75rem; font-weight: 700; color: var(--gilt-hi); margin-left: .1rem; }
.pill .plus { display: grid; place-items: center; width: 1.6rem; height: 1.6rem; margin-left: .2rem; border-radius: 50%; background: var(--green); color: #fff; }
.pill .plus svg { width: 1rem; height: 1rem; }
.heart-ico { color: #e2394f; }
/* ---------- Tab bar ---------- */
.views { position: relative; flex: 1; min-height: 0; }
.view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--navy); border-top: 3px solid var(--gilt); }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: .1rem; padding: .45rem 0 .5rem; border: 0; background: none; color: #c9d2e8; font-size: .8rem; font-weight: 700; cursor: pointer; touch-action: manipulation; }
.tab svg { width: 1.6rem; height: 1.6rem; }
.tab[aria-current="page"] { color: #fff; background: linear-gradient(rgba(178, 34, 52, .0), rgba(178, 34, 52, .45)); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -3px; left: 20%; right: 20%; height: 5px; border-radius: 0 0 4px 4px; background: var(--red-hi); }
.tab .dot { position: absolute; top: .35rem; left: calc(50% + .55rem); width: .65rem; height: .65rem; border-radius: 50%; background: var(--red-hi); box-shadow: 0 0 0 2px var(--navy); }
/* ---------- Shared page pieces ---------- */
.page { padding: 1rem var(--gutter) 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.page-head h2 { font-family: var(--serif); font-weight: 700; font-size: 1.45rem; color: var(--navy); line-height: 1.15; }
.page-head p { color: var(--ink-2); font-size: .92rem; margin-top: .2rem; }
.eyebrow { font-family: var(--serif); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.section-title { display: flex; align-items: center; gap: .6rem; font-family: var(--serif); font-weight: 700; font-size: 1.12rem; color: var(--navy); }
.section-title::after { content: ""; flex: 1; height: 0; border-top: 1.5px solid var(--parch-3); }
.card { background: var(--vellum); border-radius: var(--radius); box-shadow: 0 0 0 1.5px var(--parch-3), 0 3px 8px rgba(91, 74, 55, .12); }

<script>

(function (root) {

  function decideSpecial(g) {

  function Game(level, opts) {

    this.record = opts.record !== false;
    this.rng = new RNG(opts.seed != null ? opts.seed : (Math.random() * 4294967296) >>> 0);
    this.nextId = 1; this.cells = new Array(this.n).fill(null); this.seals = new Array(this.n).fill(0);
    this.moves = level.moves; this.movesUsed = 0; this.score = 0; this.state = 'play';
    this.maxDrops = level.maxDrops || 1;
    this.goals = level.goals.map(g => Object.assign({}, g, { got: 0 }));
    this.stats = { made: { row: 0, col: 0, keg: 0, bell: 0 }, fired: {}, cascades: 0, shuffles: 0 };

  }

  const G = Game.prototype;
  G.rc = function (i) { return [(i / this.cols) | 0, i % this.cols]; };

  G._nbrs = function (i) {
    const C = this.cols, R = this.rows, r = (i / C) | 0, c = i % C, out = [];
    if (r > 0) out.push(i - C); if (r < R - 1) out.push(i + C); if (c > 0) out.push(i - 1); if (c < C - 1) out.push(i + 1);
    return out;
  };
  G.adjacent = function (a, b) {
    if (a < 0 || b < 0 || a >= this.n || b >= this.n) return false;
    const [ra, ca] = this.rc(a), [rb, cb] = this.rc(b); return Math.abs(ra - rb) + Math.abs(ca - cb) === 1;
  };
  G._center = function (cells) {
    let sr = 0, sc = 0; for (const i of cells) { const [r, c] = this.rc(i); sr += r; sc += c; }
    sr /= cells.length; sc /= cells.length; let best = cells[0], bd = 1e9;
    for (const i of cells) { const [r, c] = this.rc(i), d = (r - sr) * (r - sr) + (c - sc) * (c - sc); if (d < bd) { bd = d; best = i; } }
    return best;

  G._setup = function () {
    const L = this.L;
    if (L.layout) {
      for (let r = 0; r < this.rows; r++) {
        const line = L.layout[r] || '';
        for (let c = 0; c < this.cols; c++) {
          const ch = line[c] || '.', i = this.idx(r, c);
          if (ch === 's') this.seals[i] = 1; else if (ch === 'S') this.seals[i] = 2; else if (ch === 'c') this.cells[i] = this._crate(1); else if (ch === 'C') this.cells[i] = this._crate(2);

    }

      if (g.kind === 'seal' && !g.n) g.n = this.seals.reduce((a, b) => a + b, 0);

  };

  G._fillFresh = function (preset) {
    const R = this.rows, C = this.cols;
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        const i = this.idx(r, c), cur = this.cells[i];
        if (cur && cur.k === 'c') continue;

        else {

          do { t = this.rng.int(this.types); tries++; }
          while (tries < 40 && ((c >= 2 && this.color(i - 1) === t && this.color(i - 2) === t) || (r >= 2 && this.color(i - C) === t && this.color(i - 2 * C) === t)));
        }
        this.cells[i] = { id: this.nextId++, k: 'p', t: t, s: null };
      }
    }
  };

  G._dropGoal = function () { return this.goals.find(g => g.kind === 'drop'); };
  G.dropsOnBoard = function () { let n = 0; for (const c of this.cells) if (c && c.k === 'd') n++; return n; };
  G._placeInitialDrops = function () {
    const g = this._dropGoal(); if (!g) return;
    const want = Math.min(this.maxDrops, g.n), cols = [];
    for (let c = 1; c < this.cols - 1; c++) cols.push(c);
    for (let k = cols.length - 1; k > 0; k--) { const j = this.rng.int(k + 1); [cols[k], cols[j]] = [cols[j], cols[k]]; }
    const row = this.L.dropStartRow || 0; let placed = 0;
    for (const c of cols) {
      if (placed >= want) break; const i = this.idx(row, c), cur = this.cells[i];
      if (cur && cur.k === 'c') continue;
      this.cells[i] = { id: this.nextId++, k: 'd' }; placed++;

  };

  G.findRuns = function () {
    const runs = [], R = this.rows, C = this.cols;
    for (let r = 0; r < R; r++) {
      let c = 0;
      while (c < C) {
        const t = this.color(r * C + c); let e = c + 1;
        if (t >= 0) while (e < C && this.color(r * C + e) === t) e++;
        if (t >= 0 && e - c >= 3) { const cells = []; for (let k = c; k < e; k++) cells.push(r * C + k); runs.push({ dir: 'h', t: t, cells: cells }); }
        c = e;
      }
    }
    for (let c = 0; c < C; c++) {
      let r = 0;
      while (r < R) {
        const t = this.color(r * C + c); let e = r + 1;
        if (t >= 0) while (e < R && this.color(e * C + c) === t) e++;
        if (t >= 0 && e - r >= 3) { const cells = []; for (let k = r; k < e; k++) cells.push(k * C + c); runs.push({ dir: 'v', t: t, cells: cells }); }

      }

  };

  G.findGroups = function () {
    const runs = this.findRuns(); if (!runs.length) return [];
    const parent = runs.map((_, i) => i);
    const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    const owner = new Map();
    runs.forEach((run, i) => run.cells.forEach(ci => { if (owner.has(ci)) { const a = find(owner.get(ci)), b = find(i); if (a !== b) parent[a] = b; } else owner.set(ci, i); }));

    runs.forEach((run, i) => {
      const rt = find(i); let g = map.get(rt);

  };

  G._placeCell = function (g, sp, prefer) {
    for (const p of prefer) if (g.cells.has(p)) return p;
    if (sp === 'keg') {
      const hCells = new Set(); g.runs.forEach(r => { if (r.dir === 'h') r.cells.forEach(c => hCells.add(c)); });
      for (const r of g.runs) if (r.dir === 'v') for (const c of r.cells) if (hCells.has(c)) return c;

    for (let k = r + 1; k < R && this.color(k * C + c) === t; k++) v++;

  };

  G.findMoves = function (limit) {

  G._checkMove = function (a, b, moves) {
