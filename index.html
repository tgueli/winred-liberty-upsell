     delay = this.T(this.dist(origin, r.i) * 28);
     maxDelay = Math.max(maxDelay, delay);
    }
    if (r.k === "c") {
     crateGone = true;
     this.burst(r.i, this.skins.crate === "ice" ? [ "#bfe3f3", "#ffffff", "#6ea8c6" ] : [ "#b7793b", "#e3c08c", "#6b4423" ]);
    }
    const el = rec.el;
    if (delay) setTimeout(() => el.classList.add("pop"), delay); else el.classList.add("pop");
   });
   if (crateGone) Sound.crate();
   ph.sealsHit.forEach(i => {
    this.updateTile(i, ph.snap.seals[i], true);
    this.burst(i, [ "#c0392f", "#f2c14e", "#fff3dc" ]);
   });
   if (ph.sealsHit.length) Sound.seal();
   ph.fx.forEach(f => {
    if (f.pts > 0 && f.fx !== "ring") this.popup(f.at, "+" + fmt(f.pts));
   });
   await wait(this.T(250) + maxDelay);
   ph.removed.forEach(r => {
    const rec = this.els.get(r.id);
    if (rec) {
     rec.el.remove();
     this.els.delete(r.id);
    }
   });
   this.sync(ph.snap, {
    dur: 0
   });
   if (ph.cratesHit.length) {
    Sound.crate();
    ph.cratesHit.forEach(i => {
     const rec = this.recAt(i);
     if (rec) {
      rec.el.classList.remove("hit");
      void rec.el.offsetWidth;
      rec.el.classList.add("hit");
     }
    });
   }
   if (ph.made.length) {
    Sound.made();
    ph.made.forEach(m => {
     const rec = this.els.get(m.id);
     if (rec) {
      rec.el.classList.remove("made");
      void rec.el.offsetWidth;
      rec.el.classList.add("made");
     }
    });
    await wait(this.T(230));
   }
  },
  async animDeliver(ph) {
   Sound.deliver();
   ph.removed.forEach(r => {
    const rec = this.els.get(r.id);
    if (rec) rec.el.classList.add("deliver");
    this.popup(r.i, "+300");
    this.burst(r.i, [ "#2e7d4f", "#f2c14e", "#ffffff" ]);
   });
   await wait(this.T(580));
   ph.removed.forEach(r => {
    const rec = this.els.get(r.id);
    if (rec) {
     rec.el.remove();
     this.els.delete(r.id);
    }
   });
  },
  async animShuffle(ph) {
   Sound.shuffle();
   this.banner("Shuffling the board", "No more matches were left", this.T(1100));
   await wait(this.T(350));
   const t = this.sync(ph.snap, {
    dur: this.T(520)
   });
   await wait(Math.max(t, this.T(700)));
  },
  async animConvert(ph) {
   const step = this.T(ph.celebrate ? 110 : 70);
   let shown = this.displayMoves;
   for (const i of ph.cells) {
    const c = ph.snap.cells[i], rec = c && this.els.get(c.id);
    if (rec) {
     rec.el.className = pieceClass(c);
     rec.el.innerHTML = pieceHTML(c, this.skins);
     rec.key = pieceKey(c);
     rec.el.classList.add("made");
    }
    Sound.select();
    if (ph.celebrate && shown > 0) {
     shown--;
     $("#hud-moves-n").textContent = shown;
     this.popup(i, "+100");
    }
    await wait(step);
   }
   this.sync(ph.snap, {
    dur: 0
   });
  },
  fxDiv(cls, style, life) {
   const d = document.createElement("div");
   d.className = cls;
   d.style.cssText = style;
   this.fxEl.appendChild(d);
   setTimeout(() => d.remove(), life || 900);
   return d;
  },
  drawFx(f) {
   const C = this.cell, cols = this.g.cols, rows = this.g.rows, p = this.xy(f.at), r = f.at / cols | 0, c = f.at % cols;
   const beamH = (row, extra) => this.fxDiv("beam h" + (extra || ""), "left:0;top:" + (row * C + C * .33) + "px;width:" + cols * C + "px;height:" + C * .34 + "px;transform-origin:" + (p[0] + C / 2) + "px 50%");
   const beamV = col => this.fxDiv("beam v", "top:0;left:" + (col * C + C * .33) + "px;height:" + rows * C + "px;width:" + C * .34 + "px;transform-origin:50% " + (p[1] + C / 2) + "px");
   const blast = rad => {
    const s = (rad * 2 + 1) * C;
    this.fxDiv("blast", "left:" + (p[0] + C / 2 - s / 2) + "px;top:" + (p[1] + C / 2 - s / 2) + "px;width:" + s + "px;height:" + s + "px");
   };
   switch (f.fx) {
   case "row":
    beamH(r);
    break;

   case "col":
    beamV(c);
    break;

   case "cross":
    beamH(r);
    beamV(c);
    break;

   case "bigcross":
    for (let d = -1; d <= 1; d++) {
     if (r + d >= 0 && r + d < rows) beamH(r + d);
     if (c + d >= 0 && c + d < cols) beamV(c + d);
    }
    break;

   case "keg":
    blast(1);
    break;

   case "bigkeg":
    blast(2);
    break;

   case "cannon":
    beamH(r, " cannon");
    break;

   case "bell":
   case "ring":
   case "all":
    this.bellFx(f);
    break;

   case "gavel":
    this.flash(f.at, 1.5);
    break;

   default:
    break;
   }
  },
  bellFx(f) {
   const C = this.cell, p = this.xy(f.at), cx = p[0] + C / 2, cy = p[1] + C / 2;
   let s = '<svg class="bell-lines" viewBox="0 0 ' + this.g.cols * C + " " + this.g.rows * C + '" aria-hidden="true">';
   (f.cells || []).forEach(t => {
    if (t === f.at) return;
    const q = this.xy(t);
    s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (q[0] + C / 2) + '" y2="' + (q[1] + C / 2) + '"/>';
   });
   this.fxDiv("", "position:absolute;left:0;top:0;right:0;bottom:0", 800).innerHTML = s + "</svg>";
   this.flash(f.at, f.fx === "all" ? 7 : 2.4);
  },
  flash(i, size) {
   const C = this.cell, p = this.xy(i), s = C * size;
   this.fxDiv("flash", "left:" + (p[0] + C / 2 - s / 2) + "px;top:" + (p[1] + C / 2 - s / 2) + "px;width:" + s + "px;height:" + s + "px", 600);
  },
  burst(i, colors) {
   if (REDUCED) return;
   const C = this.cell, p = this.xy(i);
   for (let k = 0; k < 7; k++) {
    const a = Math.random() * Math.PI * 2, d = C * (.5 + Math.random() * .7);
    this.fxDiv("spark", "left:" + (p[0] + C / 2 - 4) + "px;top:" + (p[1] + C / 2 - 4) + "px;background:" + colors[k % colors.length] + ";--dx:" + (Math.cos(a) * d).toFixed(0) + "px;--dy:" + (Math.sin(a) * d).toFixed(0) + "px", 850);
   }
  },
  popup(i, text) {
   const C = this.cell, p = this.xy(i);
   this.fxDiv("pts", "left:" + (p[0] + C / 2) + "px;top:" + (p[1] + C / 2) + "px", 950).textContent = text;
  },
  shake() {
   if (REDUCED) return;
   this.boardEl.classList.remove("shake");
   void this.boardEl.offsetWidth;
   this.boardEl.classList.add("shake");
  },
  banner(title, sub, ms) {
   const old = $(".banner", $("#board-wrap"));
   if (old) old.remove();
   const b = document.createElement("div");
   b.className = "banner";
   b.setAttribute("role", "status");
   b.innerHTML = esc(title) + (sub ? "<small>" + esc(sub) + "</small>" : "");
   $("#board-wrap").appendChild(b);
   setTimeout(() => b.remove(), ms || 1200);
  },
  armHint() {
   this.clearHint();
   if (!this.g || this.g.state !== "play") return;
   this.hintT = setTimeout(() => this.showHint(), 5500);
  },
  showHint() {
   if (this.busy || !this.g || this.g.state !== "play" || modalOpen() || $("#scr-game").hidden) return;
   const m = this.g.bestMove();
   if (m) [ m.a, m.b ].forEach(i => {
    const r = this.recAt(i);
    if (r) r.el.classList.add("hint");
   });
  },
  clearHint() {
   clearTimeout(this.hintT);
   $$(".pc.hint").forEach(e => e.classList.remove("hint"));
  },
  async win() {
   this.busy = true;
   this.clearHint();
   this.select(-1);
   Sound.star(2);
   this.banner("Huzzah!", "Goal complete", this.T(1500));
   await wait(this.T(1500));
   if (!this.g) return;
   if (this.g.moves > 0) {
    this.banner("Liberty fireworks!", "Every move you saved becomes a firework", this.T(1600));
    await wait(this.T(1600));
    this.skipMode = true;
    const note = document.createElement("div");
    note.className = "skip-note";
    note.textContent = "Tap the board to skip";
    $("#board-wrap").appendChild(note);
    await this.play(this.g.celebrate());
    note.remove();
    this.skipMode = false;
    this.skip = false;
    if (!this.g) return;
    this.hud(this.g.snapshot());
   }
   const g = this.g, stars = g.starsFor(g.score);
   recordWin(this.L.id, stars, g.score);
   Sound.fanfare();
   openWin(this.L, stars, g.score);
  },
  outOfMoves() {
   this.busy = true;
   this.clearHint();
   this.select(-1);
   Sound.lose();
   const snap = this.g.snapshot(), L = this.L, id = L.id;
   const prog = snap.goals.reduce((a, g) => a + Math.min(1, g.got / g.n), 0) / snap.goals.length;
   const rem = snap.goals.filter(g => g.got < g.n).map(g => '<div class="goal"><span class="gi">' + ico(goalIconId(g, L)) + '</span><span class="n">' + (g.n - g.got) + "</span></div>").join("");
   openModal({
    html: '<div class="ribbon-h">Out of moves</div><h2>' + (prog >= .7 ? "So close!" : "Nice try!") + "</h2>" + '<p class="lead" style="text-align:center">You still needed:</p><div class="remaining">' + rem + "</div>" + '<div class="actions"><button class="btn btn-red btn-xl" data-act="retry">' + ico("i-restart") + 'Try again</button><button class="btn btn-ghost" data-act="map">Back to Map</button></div>',
    actions: {
     retry: (t, m) => {
      m.close();
      this.start(id);
     },
     map: (t, m) => {
      m.close();
      goMap();
     }
    }
   });
  },
  pause() {
   if (!this.g || this.busy) return;
   this.clearHint();
   const snd = () => ico(S.sound ? "i-sound" : "i-mute") + "Sound: " + (S.sound ? "On" : "Off");
   openModal({
    html: '<div class="ribbon-h">Paused</div><h2>' + esc(this.L.title) + "</h2>" + '<div class="actions"><button class="btn btn-red btn-xl" data-act="resume">' + ico("i-play") + "Keep playing</button>" + '<button class="btn btn-ghost" data-act="sound">' + snd() + "</button>" + '<button class="btn btn-ghost" data-act="restart">' + ico("i-restart") + "Start over</button>" + '<button class="btn btn-ghost" data-act="quit">' + ico("i-exit") + "Back to Map</button></div>",
    dismiss: true,
    onClose: () => this.armHint(),
    actions: {
     resume: (t, m) => m.close(),
     sound: t => {
      S.sound = !S.sound;
      save();
      t.innerHTML = snd();
     },
     restart: (t, m) => {
      m.close();
      this.start(this.L.id);
     },
     quit: (t, m) => {
      m.close();
      goMap();
     }
    }
   });
  }
 };
 const ACTIONS = {
  stop: t => {
   const id = +t.dataset.id;
   if (!isUnlocked(id)) {
    toast("Win Level " + (id - 1) + " first to open this one.");
    return;
   }
   openIntro(id);
  },
  pause: () => Play.pause()
 };
 document.addEventListener("click", e => {
  const t = e.target.closest("[data-action]");
  if (!t || t.disabled) return;
  const fn = ACTIONS[t.dataset.action];
  if (!fn) return;
  Sound.unlock();
  Sound.click();
  fn(t, e);
 });
 load();
 Play.init();
 showScreen("main");
 renderMap();
 window.addEventListener("resize", () => {
  if (!$("#scr-main").hidden) drawRoad();
 });
 document.addEventListener("visibilitychange", () => {
  if (document.hidden) save();
 });
 window.LibertyMatch = {
  Play,
  state: () => S
 };
})();
</script>
</body>
